[package]
name = "plexus-jsexec"
version = "0.2.0"
edition = "2021"
description = "JavaScript execution plugin for Plexus using workerd V8 isolates"
license = "AGPL-3.0-only"

[lib]
name = "plexus_jsexec"
path = "src/lib.rs"

[dependencies]
# Plexus infrastructure
plexus-core = "0.2.1"
plexus-macros = "0.2.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full", "process"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Schema generation
schemars = { version = "1.1", features = ["derive", "uuid1"] }

# Core types
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for workerd communication
reqwest = { version = "0.12", features = ["json", "stream"] }

# Hashing for script content
md-5 = "0.10"
sha2 = "0.10"

# Persistent storage for Lambda functions
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }

# Logging
tracing = "0.1"

# JSON-RPC (required by plexus-macros generated code)
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# Temp files for workerd config
tempfile = "3"
regex = "1.12.2"

# Tool discovery and paths
which = "7"
dirs = "6"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3"
